<!--
  Ícone maskable para manifest.json (purpose: "maskable"). Fundo de sangria
  total (sem cantos), marca contida no círculo de segurança de raio 40% —
  o Android pode recortar em círculo, "squircle" ou qualquer forma sem cortar a marca.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cora">
  <title>Cora</title>
  <rect x="0" y="0" width="512" height="512" fill="oklch(0.38 0.085 255)"/>
  <path d="M333.82,310.49 A95,95 0 1,1 333.82,201.51"
        fill="none" stroke="oklch(0.99 0.004 250)" stroke-width="45" stroke-linecap="round"/>
</svg>
