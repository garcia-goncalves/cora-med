<!--
  Erro de conexão / "não consegui consultar" (frase distinta de "sem
  pendências", resumo.ts). Usa o token de cor erro, corrigido para AA no júri
  de design. Inline no HTML para herdar o tema via variável CSS.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-hidden="true">
  <path fill="var(--color-erro, oklch(0.47 0.190 25))" opacity="0.07"
        d="M120,30c30,0,58,13,74,39c15,25,14,58,-2,83c-16,24,-46,38,-76,36
           c-30,-2,-58,-20,-70,-47c-12,-27,-5,-60,17,-80C81,42,100,30,120,30Z"/>
  <!-- arcos de sinal, o mais externo interrompido -->
  <path d="M84,120 a51,51 0 0 1 72,0" fill="none"
        stroke="var(--color-muted-foreground, oklch(0.46 0.015 250))" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <path d="M99,132 a29,29 0 0 1 42,0" fill="none"
        stroke="var(--color-muted-foreground, oklch(0.46 0.015 250))" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="120" cy="146" r="5" fill="var(--color-muted-foreground, oklch(0.46 0.015 250))"/>
  <!-- barra diagonal de "sem conexão" -->
  <line x1="66" y1="96" x2="174" y2="176" stroke="var(--color-erro, oklch(0.47 0.190 25))"
        stroke-width="7" stroke-linecap="round"/>
  <!-- selo de alerta -->
  <circle cx="168" cy="70" r="24" fill="var(--color-erro, oklch(0.47 0.190 25))"/>
  <line x1="168" y1="60" x2="168" y2="72" stroke="var(--color-erro-foreground, oklch(0.99 0.004 25))" stroke-width="5" stroke-linecap="round"/>
  <circle cx="168" cy="80" r="2.6" fill="var(--color-erro-foreground, oklch(0.99 0.004 25))"/>
</svg>
