<!--
  Marca + nome, para o cabeçalho da tela de login e do chat. Pensado para
  ser inserido inline no HTML (não via <img>) para herdar as variáveis CSS
  do tema; os valores oklch() abaixo são o fallback quando usado como arquivo
  solto (ex.: og:image, compartilhamento).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" role="img" aria-label="Cora">
  <title>Cora</title>
  <rect x="0" y="0" width="40" height="40" rx="9"
        fill="var(--color-primary, oklch(0.38 0.085 255))"/>
  <path d="M30.65,27.46 A13,13 0 1,1 30.65,12.54"
        fill="none" stroke="var(--color-primary-foreground, oklch(0.99 0.004 250))"
        stroke-width="6" stroke-linecap="round"/>
  <text x="52" y="28" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="600" letter-spacing="-0.02em"
        fill="var(--color-foreground, oklch(0.20 0.020 250))">Cora</text>
</svg>
